<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App desactivada</title>
<meta name="robots" content="noindex"><link rel="icon" type="image/png" href="../icons/icon-192.png"><meta name="theme-color" content="#0a2557">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f4f7;font-family:system-ui,sans-serif;color:#101828;padding:16px;box-sizing:border-box}
.c{background:#fff;border:1px solid #e4e8ee;border-radius:16px;padding:28px 24px;max-width:380px;text-align:center}h1{font-size:20px;margin:0 0 8px}p{color:#667085;margin:0 0 18px;line-height:1.5}
a{display:inline-block;background:#0a2557;color:#fff;text-decoration:none;padding:10px 18px;border-radius:10px;font-weight:600}</style></head>
<body><div class="c"><h1>App distribución desactivada</h1><p>Esta app ya no está en uso. Para el reparto use la App repartidores.</p><a href="../">Ir al inicio</a></div>
<script>if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(l=>l.forEach(r=>{if(r.scope.includes("/distribucion/"))r.unregister()}));
if(window.caches)caches.keys().then(k=>k.filter(x=>x.startsWith("mrgas-dist")).forEach(x=>caches.delete(x)));</script></body></html>
